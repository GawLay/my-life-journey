<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#171713" />
    <title>Explore My World — Phyo Aung Zaw</title>
    <meta name="description" content="An interactive atlas of places, photographs and memories from Phyo Aung Zaw." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/styles/main.css" />
    <link rel="stylesheet" href="/src/styles/world.css" />
    <link rel="stylesheet" href="/src/styles/discovery.css" />
    <link rel="stylesheet" href="/src/styles/world-discovery.css" />
  </head>
  <body class="world-page">
    <canvas class="liquid-trail" id="liquid-trail" aria-hidden="true"></canvas>
    <div class="world-entry" aria-hidden="true"><span>EXPLORE MY WORLD</span></div>

    <header class="world-header">
      <a class="world-header__back" href="./index.html"><span aria-hidden="true">←</span><span data-wave>Work / PAZ</span></a>
      <p data-wave>PLACES / PHOTOGRAPHY / MEMORY</p>
      <button class="nav__sound is-on" type="button" aria-pressed="true" aria-label="Turn off the lo-fi soundscape">
        <span class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
        <span class="nav__sound-label" data-wave>Lo-fi on</span>
      </button>
    </header>

    <main class="world" id="world">
      <div class="world__intro">
        <p>AN INTERACTIVE ATLAS / 05 CHAPTERS</p>
        <h1>Explore my <em>world.</em></h1>
        <span>Drag the globe. Select a warm country.</span>
      </div>

      <div class="world__scene">
        <div class="world-memory world-memory--one" aria-hidden="true"><span>LIGHT / 01</span></div>
        <div class="world-memory world-memory--two" aria-hidden="true"><span>STREET / 02</span></div>
        <div class="world-memory world-memory--three" aria-hidden="true"><span>WEATHER / 03</span></div>
        <div class="world-memory world-memory--four" aria-hidden="true"><span>PEOPLE / 04</span></div>
        <div class="world__globe" id="world-globe" role="application" aria-label="Interactive world globe. Drag to rotate and select a highlighted country."></div>
      </div>

      <div class="world__instruction" aria-hidden="true"><span>DRAG TO ROTATE</span><i></i><span>SELECT A COUNTRY</span></div>
      <nav class="world__countries" id="world-countries" aria-label="Visited countries"></nav>
    </main>

    <header class="discovery-header world-discovery-header" id="world-discovery-header" aria-hidden="true">
      <button class="discovery-header__back" id="discovery-back" type="button">
        <span aria-hidden="true">←</span><span data-wave>Back to world</span>
      </button>
      <span id="discovery-header-label" data-wave>COUNTRY / DISCOVERY</span>
      <a class="discovery-header__deep" id="discovery-deep-link" href="./country.html">
        <span data-wave>Deep dive ↗</span>
      </a>
    </header>

    <section class="country-discovery" id="country-discovery" aria-hidden="true">
      <div id="country-discovery-content"></div>
    </section>

    <div class="memory-viewer" id="memory-viewer" role="dialog" aria-modal="true" aria-labelledby="memory-viewer-title" hidden>
      <button class="memory-viewer__close" type="button" aria-label="Close memory preview">CLOSE ×</button>
      <div class="memory-viewer__surface" id="memory-viewer-surface"></div>
      <div class="memory-viewer__caption">
        <span id="memory-viewer-index">01</span>
        <h2 id="memory-viewer-title">MEMORY</h2>
        <p id="memory-viewer-note">FIELD NOTE</p>
      </div>
    </div>

    <script type="module" src="/src/world.js"></script>
  </body>
</html>
